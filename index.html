<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Contact<span>Book</span></h1>
        <p>Your personal contact manager</p>
    </header>

    <main class="container">

        <section class="form-section">
            <h2 id="formTitle">Add New Contact</h2>

            <form id="contactForm">
                <label for="name">Full Name</label>
                <input type="text" id="name"
                       placeholder="Enter full name" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone"
                       placeholder="Enter phone number"
                       pattern="[0-9+\-() ]{7,20}" required>

                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter email address" required>

                <button type="submit" id="submitBtn">
                    Add Contact
                </button>

                <button type="button" id="cancelBtn" hidden>
                    Cancel Edit
                </button>
            </form>
        </section>

        <section class="contacts-section">
            <h2>My Contacts</h2>

            <input type="search" id="searchInput"
                   placeholder="Search by name, phone or email..."
                   aria-label="Search contacts">

            <p id="contactCount">0 contacts</p>

            <div id="contactList" class="contact-list"></div>
            <p id="emptyMessage">No contacts yet. Add your first contact!</p>
        </section>

    </main>

    <footer>
        <p>ContactBook &copy; 2026 | Made with HTML, CSS & JavaScript</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
